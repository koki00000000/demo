# Server Port
server.port=${PORT:8080}
server.error.include-message=always

# PostgreSQL Settings (credentials are supplied by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Release idle connections so Neon can scale to zero when the app is not being used.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=600000

# The browser handles reminders while the app is open. A server-side query every minute
# would keep Neon's compute awake continuously. Set true only when always-on checks are needed.
notifications.scheduled.enabled=${NOTIFICATIONS_SCHEDULED_ENABLED:false}

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Response Anti-Cache
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-store=true

# Google Calendar OAuth (set these as environment variables; never paste secrets into this file)
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/google-calendar/callback}
